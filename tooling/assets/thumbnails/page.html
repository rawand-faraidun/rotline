<!doctype html>
<html lang="en">
	<body style="margin: 0; background: transparent">
		<canvas id="view" width="1280" height="720"></canvas>
		<script type="importmap">
			{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
		</script>
		<script type="module">
			import * as THREE from 'three'
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
			import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

			// the same studio as the in-game viewer: side on, a soft room, a lime rim
			const canvas = document.getElementById('view')
			const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true })
			renderer.toneMapping = THREE.ACESFilmicToneMapping
			renderer.toneMappingExposure = 1.1
			renderer.outputColorSpace = THREE.SRGBColorSpace
			const scene = new THREE.Scene()
			scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
			scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x2a3129, 1.6))
			const key = new THREE.DirectionalLight(0xfff1dd, 3)
			key.position.set(1.5, 3, 3)
			const rim = new THREE.DirectionalLight(0xb8f23c, 1.4)
			rim.position.set(-3, 1, -2)
			scene.add(key, rim)
			// every gun from the same side view, a little from above, without perspective, so the stills all match
			const half = 0.8
			const aspect = canvas.width / canvas.height
			const camera = new THREE.OrthographicCamera(-half * aspect, half * aspect, half, -half, 0.01, 50)
			camera.position.set(0.25, 0.55, 4)
			camera.lookAt(0, 0, 0)
			const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)

			window.render = async url => {
				const gltf = await loader.loadAsync(url)
				const model = gltf.scene
				const box = new THREE.Box3().setFromObject(model)
				const size = box.getSize(new THREE.Vector3())
				const fit = 1.45 / Math.max(size.x, size.y, size.z, 0.01)
				model.scale.setScalar(fit)
				model.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(fit))
				scene.add(model)
				renderer.render(scene, camera)
				const data = canvas.toDataURL('image/png')
				scene.remove(model)
				return data
			}
			const pale = new Map()
			function undyed(texture) {
				if (pale.has(texture)) return pale.get(texture)
				const image = texture.image
				const canvas = document.createElement('canvas')
				canvas.width = image.width
				canvas.height = image.height
				const ctx = canvas.getContext('2d')
				ctx.drawImage(image, 0, 0)
				const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height)
				const data = pixels.data
				let sum = 0
				for (let i = 0; i < data.length; i += 4) sum += 0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2]
				const gain = 175 / Math.max(1, sum / (data.length / 4))
				for (let i = 0; i < data.length; i += 4)
					data[i] = data[i + 1] = data[i + 2] = Math.min(255, (0.3 * data[i] + 0.59 * data[i + 1] + 0.11 * data[i + 2]) * gain)
				ctx.putImageData(pixels, 0, 0)
				const copy = new THREE.CanvasTexture(canvas)
				copy.colorSpace = texture.colorSpace
				copy.flipY = texture.flipY
				copy.wrapS = texture.wrapS
				copy.wrapT = texture.wrapT
				copy.channel = texture.channel
				pale.set(texture, copy)
				return copy
			}
			// an armour piece: the soldier with every other piece hidden, turned a little toward the light
			let soldier = null
			window.renderPiece = async (url, piece, tint) => {
				if (!soldier) soldier = (await loader.loadAsync(url)).scene
				const model = soldier
				model.rotation.set(0, -0.45, 0)
				model.scale.setScalar(1)
				model.position.set(0, 0, 0)
				model.updateMatrixWorld(true)
				const shown = new Set()
				// a piece made of several meshes arrives as name, name_1, name_2… (names are kept unique)
				model.traverse(object => {
					if (object.name.replace(/_\d+$/, '') === piece) object.traverse(part => shown.add(part))
				})
				const box = new THREE.Box3()
				model.traverse(object => {
					if (!object.isMesh) return
					object.visible = shown.has(object)
					if (!object.visible) return
					if (!object.userData.paint) object.userData.paint = object.material
					object.material = object.userData.paint.clone()
					if (tint) {
						object.material.color.setHex(tint)
						// as in the game: the dark cloth texture is greyed and lightened so the dye shows
						if (object.material.map) object.material.map = undyed(object.material.map)
					}
					box.expandByObject(object, true)
				})
				const size = box.getSize(new THREE.Vector3())
				const fit = 1.3 / Math.max(size.x, size.y, size.z, 0.01)
				model.scale.setScalar(fit)
				model.position.copy(box.getCenter(new THREE.Vector3()).multiplyScalar(-fit))
				scene.add(model)
				renderer.render(scene, camera)
				const data = canvas.toDataURL('image/png')
				scene.remove(model)
				return data
			}
			window.ready = true
		</script>
	</body>
</html>
