<!doctype html>
<html lang="en">
	<body style="margin: 0; background: transparent">
		<canvas id="view" width="1280" height="720"></canvas>
		<script type="importmap">
			{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
		</script>
		<script type="module">
			import * as THREE from 'three'
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
			import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

			// the same studio as the in-game viewer: side on, a soft room, a lime rim
			const canvas = document.getElementById('view')
			const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true })
			renderer.toneMapping = THREE.ACESFilmicToneMapping
			renderer.toneMappingExposure = 1.1
			renderer.outputColorSpace = THREE.SRGBColorSpace
			const scene = new THREE.Scene()
			scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
			scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x2a3129, 1.6))
			const key = new THREE.DirectionalLight(0xfff1dd, 3)
			key.position.set(1.5, 3, 3)
			const rim = new THREE.DirectionalLight(0xb8f23c, 1.4)
			rim.position.set(-3, 1, -2)
			scene.add(key, rim)
			// every gun from the same side view, a little from above, without perspective, so the stills all match
			const half = 0.8
			const aspect = canvas.width / canvas.height
			const camera = new THREE.OrthographicCamera(-half * aspect, half * aspect, half, -half, 0.01, 50)
			camera.position.set(0.25, 0.55, 4)
			camera.lookAt(0, 0, 0)
			const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)

			window.render = async url => {
				const gltf = await loader.loadAsync(url)
				const model = gltf.scene
				const box = new THREE.Box3().setFromObject(model)
				const size = box.getSize(new THREE.Vector3())
				const fit = 1.45 / Math.max(size.x, size.y, size.z, 0.01)
				model.scale.setScalar(fit)
				model.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(fit))
				scene.add(model)
				renderer.render(scene, camera)
				const data = canvas.toDataURL('image/png')
				scene.remove(model)
				return data
			}
			// an armour piece: the soldier with every other piece hidden, turned a little toward the light
			let soldier = null
			window.renderPiece = async (url, piece, tint) => {
				if (!soldier) soldier = (await loader.loadAsync(url)).scene
				const model = soldier
				model.rotation.set(0, -0.45, 0)
				model.scale.setScalar(1)
				model.position.set(0, 0, 0)
				model.updateMatrixWorld(true)
				const shown = new Set()
				model.getObjectByName(piece)?.traverse(object => shown.add(object))
				const box = new THREE.Box3()
				model.traverse(object => {
					if (!object.isMesh) return
					object.visible = shown.has(object)
					if (!object.visible) return
					if (!object.userData.paint) object.userData.paint = object.material
					object.material = object.userData.paint.clone()
					if (tint) object.material.color.setHex(tint)
					box.expandByObject(object, true)
				})
				const size = box.getSize(new THREE.Vector3())
				const fit = 1.3 / Math.max(size.x, size.y, size.z, 0.01)
				model.scale.setScalar(fit)
				model.position.copy(box.getCenter(new THREE.Vector3()).multiplyScalar(-fit))
				scene.add(model)
				renderer.render(scene, camera)
				const data = canvas.toDataURL('image/png')
				scene.remove(model)
				return data
			}
			window.ready = true
		</script>
	</body>
</html>
