name: Images

# Builds and publishes the images of one commit, tagged sha-<commit> and main. Called by Version.
on:
  workflow_call:
    inputs:
      ref:
        description: Full commit to build
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: migrate
            dockerfile: packages/db/Dockerfile
          - name: game
            dockerfile: apps/game-server/Dockerfile
          - name: queue
            dockerfile: apps/queue/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:sha-${{ inputs.ref }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
