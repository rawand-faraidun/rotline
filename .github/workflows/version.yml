name: Version

# After CI passes on a push to main: apply pending changesets (bump the shared version, write the
# changelogs) in a "Version packages" commit on main, tag vX.Y.Z and run the release.
# No pull request: main only receives work that is already known to be good.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Only the commit CI tested
        id: current
        # if main moved on since, the newer commit's own CI run versions it
        run: echo "ok=$([ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - if: steps.current.outputs.ok == 'true'
        uses: ./.github/actions/setup
      - name: Version packages
        if: steps.current.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version-packages
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Version packages"
            git push origin HEAD:main
          fi
      - name: Tag the release
        id: tag
        if: steps.current.outputs.ok == 'true'
        run: pnpm --silent release:tag >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
