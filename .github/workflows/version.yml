name: Version

# After CI passes on a push to main, everything else happens here, ending in exactly one deploy:
# - with pending changesets: bump the shared version and write the changelogs in a "Version packages"
#   commit on main (merged back into dev), tag vX.Y.Z, publish the images and the GitHub release,
#   deploy vX.Y.Z;
# - without: publish the images of the tested commit and deploy them (sha-<commit>).
# No pull request: main only receives work that is already known to be good.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
      current: ${{ steps.current.outputs.ok }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Only the commit CI tested
        id: current
        # if main moved on since, the newer commit's own CI run versions it
        run: echo "ok=$([ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - if: steps.current.outputs.ok == 'true'
        uses: ./.github/actions/setup
      - name: Version packages
        if: steps.current.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version-packages
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Version packages"
            git push origin HEAD:main
          fi
      - name: Tag the release
        id: tag
        if: steps.current.outputs.ok == 'true'
        run: pnpm --silent release:tag >> "$GITHUB_OUTPUT"
      - name: Bring dev up to date with main
        # the version commit (and anything else on main) goes back to dev, so the next push from dev
        # to main is a plain fast-forward; a conflict leaves dev alone and says so
        if: steps.current.outputs.ok == 'true'
        run: |
          main="$(git rev-parse HEAD)"
          git fetch origin dev
          git checkout -B dev origin/dev
          if git merge --no-edit "$main"; then
            git push origin dev
          else
            git merge --abort || true
            echo "::warning::dev could not take main's changes automatically; merge main into dev by hand"
          fi

  release:
    needs: version
    if: needs.version.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  deploy-release:
    needs: [version, release]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit

  # no new version: the tested commit itself is published and deployed
  images:
    needs: version
    if: needs.version.outputs.current == 'true' && needs.version.outputs.created != 'true'
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  deploy:
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      version: sha-${{ github.event.workflow_run.head_sha }}
    secrets: inherit
