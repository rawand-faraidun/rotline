name: Version

# On main: open or update the "Version packages" pull request while changesets are pending.
# Once it is merged (no changesets left), tag vX.Y.Z and run the release.
on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Version pull request
        id: changesets
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the release
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm --silent release:tag >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
