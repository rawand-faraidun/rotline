name: Release

# A version tag (v1.2.3) publishes versioned images and a GitHub release.
# Runs when a v* tag is pushed by hand, or is called by the Version workflow after it tags a release
# (tags pushed with the workflow token do not trigger other workflows on their own).
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: migrate
            dockerfile: packages/db/Dockerfile
          - name: game
            dockerfile: apps/game-server/Dockerfile
          - name: queue
            dockerfile: apps/queue/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Release notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v v="## $version" '$0==v{on=1;next} /^## /{if(on)exit} on' apps/web/CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Rotline $TAG" > notes.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Rotline ${{ inputs.tag || github.ref_name }}
          body_path: notes.md

  deploy:
    # Switched on when deployment starts; the deploy configuration lives outside this repository.
    if: false
    needs: release
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy ${{ github.ref_name }}"
