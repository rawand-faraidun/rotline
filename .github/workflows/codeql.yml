name: CodeQL

# Code scanning is free for public repositories; on a private repository it needs GitHub Code Security,
# so this workflow skips itself there.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
