name: Setup
description: Node from .nvmrc, pnpm from packageManager, install dependencies, generate the Prisma client
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm --filter @rotline/db generate
      shell: bash
